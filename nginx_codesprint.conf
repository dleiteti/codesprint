server {
    server_name codesprint.com.br www.codesprint.com.br;

    root /var/www/codesprint;
    index index.html;

    # Assets estaticos Next.js com cache agressivo
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Imagens e fontes
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Servir arquivos estaticos de proposta diretamente (Desativado para liberar o Next.js SSG)
    # location /clientes/ {
    #     alias /var/www/codesprint/public/clientes/;
    #     try_files $uri $uri/ =404;
    #     add_header Cache-Control "public, max-age=3600";
    # }

    # PDFs para download direto
    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ =404;
    }

    # Chat AI — Sofia proxy
    location = /chat {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Telegram Event Notifier proxy
    location = /notify {
        proxy_pass http://127.0.0.1:8056;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy para capturas MailerLite e Tracking (@codigodeaco_)
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Todas as rotas - tentar arquivo, pasta, ou .html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/codesprint.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codesprint.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.codesprint.com.br) {
        return 301 https://$host$request_uri;
    }

    if ($host = codesprint.com.br) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name codesprint.com.br www.codesprint.com.br;
    return 404;
}
